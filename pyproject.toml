[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-swe-controller"
version = "0.1.0"
description = "Deterministic local-first controller for SWE agent workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
observability = [
  "opentelemetry-api>=1.25,<2",
]
orchestration = [
  "langgraph>=0.2,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[project.scripts]
local-swe = "local_swe_controller.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/local_swe_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
]
